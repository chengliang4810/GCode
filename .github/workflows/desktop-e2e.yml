name: Native desktop verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "internal/desktop/**"
      - "internal/e2e/**"
      - ".github/workflows/desktop-e2e.yml"

permissions:
  contents: read

jobs:
  desktop:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run isolated native settings flow
        run: go run ./scripts/desktop-e2e -run 'TestDesktopLocal(SettingsPersistence|GlobalInstructionsPersistence)' -timeout 8m -out-dir output/native-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-desktop-evidence
          path: output/native-ci
          if-no-files-found: warn
