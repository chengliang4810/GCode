name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify release tag
        shell: pwsh
        run: |
          $config = Get-Content -Raw mygo.json | ConvertFrom-Json
          if ($env:GITHUB_REF -ne "refs/tags/v$($config.version)") {
            throw 'Run this workflow on the version tag matching mygo.json.'
          }
      - name: Race checks
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build.ps1 -Targets windows/amd64
      - name: Build macOS
        if: runner.os == 'macOS'
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: sh ./scripts/build-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            build/*/update-*.json
            build/*/*.tar.gz
            build/*/*.delta
            build/*/* Setup *.exe
            build/*/*.dmg
            build/GCode-*.zip
            build/release-manifest-*.json

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Upload complete draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > release-state.json; then
            jq -e '.isDraft == true' release-state.json > /dev/null ||
              { echo "Refusing to replace a published release." >&2; exit 1; }
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "GCode $tag" --notes-file CHANGELOG.md
          fi
          mapfile -d '' assets < <(find release-assets -type f -print0)
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
