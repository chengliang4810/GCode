[package]
name = "zeron-fixture-wgc"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "=1.0.104"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
windows-capture = "=1.5.0"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
